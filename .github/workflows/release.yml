name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest permission gate
        run: scripts/check-manifest.sh

      - name: Exported component gate
        run: scripts/check-exported.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          # AGP looks for hash android-37; the package installs as android-37.0 (runner-images#13859)
          sudo ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "aicon-ai-studio-${{ github.ref_name }}-debug.apk"

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "AiCoN AI Studio ${{ github.ref_name }}" \
            --notes "Test build, debug-signed. Install on a phone to try on-device chat. All inference runs locally." || true
          gh release upload "${{ github.ref_name }}" "aicon-ai-studio-${{ github.ref_name }}-debug.apk" --clobber
