name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest permission gate
        run: scripts/check-manifest.sh

      - name: Exported component gate
        run: scripts/check-exported.sh

  build:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          # AGP looks for hash android-37; the package installs as android-37.0 (runner-images#13859)
          sudo ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Decode signing keystore
        run: |
          if [ -n "$KSB64" ]; then echo "$KSB64" | base64 -d > "$RUNNER_TEMP/aicon-studio.keystore"; fi
        env:
          KSB64: ${{ secrets.AICON_SIGNING_KEYSTORE_B64 }}

      - name: Build
        env:
          AICON_STORE_FILE: ${{ runner.temp }}/aicon-studio.keystore
          AICON_STORE_PASSWORD: ${{ secrets.AICON_SIGNING_STORE_PASSWORD }}
          AICON_KEY_ALIAS: ${{ secrets.AICON_SIGNING_KEY_ALIAS }}
          AICON_KEY_PASSWORD: ${{ secrets.AICON_SIGNING_STORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Lint
        run: gradle lintDebug --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
