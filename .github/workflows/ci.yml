name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifest permission gate
        run: scripts/check-manifest.sh

      - name: Exported component gate
        run: scripts/check-exported.sh

  build:
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Lint
        run: gradle lintDebug --no-daemon

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
